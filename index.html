<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Page</title>
    <style>
        @font-face {
            font-family: 'Minecraftia';
            src: url('assets/fonts/Minecraftia.ttf') format('truetype');
        }   
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: url('assets/bg.png') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Minecraftia';
        }

        .card {
            margin: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            overflow: hidden;
        }

        .background-photo {
            width: 100%;
            height: 150px;
            background: url('assets/background.jpg') center/cover no-repeat;
            position: relative;
        }

        .profile-photo-container {
            position: relative;
            top: -50px;
            display: flex;
            justify-content: center;
        }

        .profile-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: url('assets/profile.png') center/cover no-repeat;
            border: 5px solid white; /* Stroke around the profile photo */
        }

        .text {
            margin-top: -60px;  
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .buttons button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #ffc55d;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            font-family: 'Minecraftia';
        }

        .buttons button:hover {
            background: #ffdfa3;
        }

        @media (min-width: 600px) {
            .buttons {
                flex-direction: row;
                justify-content: center;
            }

            .buttons button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="background-photo"></div>
        <div style="padding:20px;">
            <div class="profile-photo-container">
                <div class="profile-photo"></div>
            </div>
            <div class="text">
                <h2>Fender Ifan</h2>
                <p>Welcome to my personal page.</p>
            </div>
            <div class="buttons">
                <button>Introduction</button>
                <button>Commissions</button>
                <button>Projects</button>
            </div>
        </div>
    </div>
</body>
</html>
